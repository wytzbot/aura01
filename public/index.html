<script type="module">
import {initializeApp,getApps} from "firebase/app";
import {getAuth,signInWithRedirect,getRedirectResult,GoogleAuthProvider,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence} from "firebase/auth";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,query,orderBy,limit,getDocs,deleteDoc,serverTimestamp} from "firebase/firestore";

const firebaseConfig=window.AURA_FIREBASE_CONFIG;
const app=!getApps().length?initializeApp(firebaseConfig):getApps()[0];
const auth=getAuth(app); auth.useDeviceLanguage(); await setPersistence(auth,browserLocalPersistence);
const db=getFirestore(app); const google=new GoogleAuthProvider();
google.setCustomParameters({prompt:"select_account"});
const API="/api"; let user=null,currentChat=null,chats=[],busy=false,plan="free";

const appEl=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const notify=(msg,type="info")=>{const n=document.createElement("div");n.className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] max-w-[90vw] px-4 py-3 rounded-2xl bg-[#27231f] text-white text-sm shadow-2xl fade";n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),3200)};
const friendly=e=>{
 const m=e?.message||"";
 const isAuthError=/\(auth\//i.test(m)||/^auth\//i.test(m);
 if(isAuthError){
  if(/network-request-failed/i.test(m))return"AURA couldn't reach the sign-in service. Check your connection and try again.";
  if(/popup/i.test(m))return"Google sign-in was interrupted. Please allow popups for AURA and try again.";
  if(/invalid-credential|wrong-password/i.test(m))return"That email or password doesn't match. Please check it and try again.";
  if(/email-already/i.test(m))return"An account already exists with that email. Try signing in instead.";
  if(/weak-password/i.test(m))return"Choose a stronger password (at least 6 characters).";
  return m.replace(/^Firebase:\s*/,"").replace(/\s*\(auth\/[^)]+\)\.?/,"")||"Something went wrong. Please try again.";
 }
 if(/network|fetch|failed to fetch/i.test(m))return"AURA couldn't reach its AI service just now. Your account is safe — please try again in a moment.";
 if(/popup/i.test(m))return"Google sign-in was interrupted. Please allow popups for AURA and try again.";
 return m.replace(/^Firebase:\s*/,"").replace(/\s*\(auth\/[^)]+\)\.?/,"")||"Something went wrong. Please try again.";
};

function renderAuth(){
 appEl.innerHTML=document.getElementById("authTemplate").innerHTML; lucide.createIcons();
 document.getElementById("googleBtn").onclick=()=>startGoogleSignIn();
}
// One single, simple sign-in path (redirect) instead of popup-with-redirect-fallback —
// popups add a fragile postMessage handshake between windows that's the first thing to
// break on a slow or flaky connection. A full-page redirect is one plain request/response,
// which is far more reliable on bad networks even though it feels a touch slower.
async function startGoogleSignIn(retrying=false){
 const b=document.getElementById("googleBtn");
 if(b){b.disabled=true;b.innerHTML=retrying?"Retrying…":"Opening secure Google sign-in…";}
 try{
  await signInWithRedirect(auth,google);
 }catch(e){
  if(!retrying&&/network-request-failed/i.test(e?.message||"")){
   // Transient blips are common on cellular — one silent retry before bothering the user.
   await new Promise(r=>setTimeout(r,1200));
   return startGoogleSignIn(true);
  }
  const er=document.getElementById("authError");
  if(er){er.textContent=friendly(e);er.classList.remove("hidden");}
  if(b){b.disabled=false;b.innerHTML='<span class="text-lg">G</span> Continue with Google';}
 }
}

async function token(){if(!user)throw Error("Please sign in first.");return user.getIdToken()};
async function api(path,body){const t=await token();const r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"AURA couldn't complete that request.");return d}

async function saveUser(){if(!user)return;await setDoc(doc(db,"users",user.uid),{email:user.email||"",displayName:user.displayName||"",updatedAt:serverTimestamp()},{merge:true})}
async function loadPlan(){const s=await getDoc(doc(db,"users",user.uid));plan=s.exists()?s.data().plan||"free":"free"}
async function loadChats(){const q=query(collection(db,"users",user.uid,"chats"),orderBy("updatedAt","desc"),limit(30));const snap=await getDocs(q);chats=snap.docs.map(d=>({id:d.id,...d.data(),messages:[]}));if(!chats.length)await newChat(false);else await openChat(chats[0].id)}
async function loadMessages(id){const q=query(collection(db,"users",user.uid,"chats",id,"messages"),orderBy("createdAt","asc"),limit(100));const s=await getDocs(q);return s.docs.map(d=>({id:d.id,...d.data()}))}
async function newChat(close=true){
 try{
  const r=await addDoc(collection(db,"users",user.uid,"chats"),{title:"New conversation",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
  const c={id:r.id,title:"New conversation",messages:[]};chats.unshift(c);currentChat=c;render();if(close)closeMenu()
 }catch(e){notify("AURA couldn't start a new chat. Check your connection and try again.")}
}
async function openChat(id){
 const c=chats.find(x=>x.id===id);if(!c)return;
 try{
  c.messages=await loadMessages(id);currentChat=c;render();closeMenu()
 }catch(e){console.error("openChat failed",id,e);notify("AURA couldn't load that chat. Check your connection and try again.")}
}
async function saveMessage(m){const r=await addDoc(collection(db,"users",user.uid,"chats",currentChat.id,"messages"),{role:m.role,content:m.content,attachment:m.attachment||null,createdAt:serverTimestamp()});m.id=r.id;await setDoc(doc(db,"users",user.uid,"chats",currentChat.id),{updatedAt:serverTimestamp(),title:currentChat.title},{merge:true})}
async function removeChat(id){
 try{
  await deleteDoc(doc(db,"users",user.uid,"chats",id));chats=chats.filter(c=>c.id!==id);
  if(!chats.length)return newChat(false);
  await openChat(chats[0].id)
 }catch(e){notify("AURA couldn't delete that chat. Check your connection and try again.")}
}
function closeMenu(){document.getElementById("drawer")?.classList.add("-translate-x-full");document.getElementById("shade")?.classList.add("hidden")}

function render(){
 const prevInput=document.getElementById("input");
 const keepValue=prevInput?prevInput.value:"";
 const hadFocus=!!prevInput&&prevInput===document.activeElement;
 const selStart=prevInput?prevInput.selectionStart:null,selEnd=prevInput?prevInput.selectionEnd:null;
 const msgs=currentChat?.messages||[];
 appEl.innerHTML=`<div class="h-full flex flex-col">
 <header class="h-16 shrink-0 glass border-b border-[var(--line)] flex items-center justify-between px-3 sm:px-5 z-20">
  <button id="menuBtn" class="press p-3 rounded-2xl hover:bg-[#f1e9e3]"><i data-lucide="menu"></i></button>
  <div class="flex items-center gap-2"><div class="w-8 h-8 rounded-xl bg-[#f2e0d8] flex items-center justify-center"><i data-lucide="sparkles" class="w-4 h-4 text-[var(--accent)]"></i></div><b>AURA</b><span class="text-xs text-[var(--muted)]">AI</span></div>
  <button id="newTop" class="press p-3 rounded-2xl hover:bg-[#f1e9e3]"><i data-lucide="square-pen"></i></button>
 </header>
 <div class="flex-1 min-h-0 relative">
  <aside id="drawer" class="sheet fixed md:absolute inset-y-0 left-0 w-[310px] max-w-[88vw] bg-[var(--panel)] border-r border-[var(--line)] z-50 -translate-x-full md:translate-x-0 transition-transform duration-200 flex flex-col">
   <div class="p-4 flex items-center justify-between border-b border-[var(--line)]"><b class="text-lg">AURA</b><button id="closeMenu" class="md:hidden p-2"><i data-lucide="x"></i></button></div>
   <div class="p-3 space-y-2"><button id="newSide" class="press w-full h-11 rounded-2xl bg-[#f2e0d8] text-[var(--accent2)] font-bold flex items-center justify-center gap-2"><i data-lucide="plus"></i> New chat</button><button id="searchBtn" class="press w-full h-11 rounded-2xl border border-[var(--line)] flex items-center gap-2 px-4"><i data-lucide="search"></i> Search chats</button></div>
   <div class="px-4 text-xs uppercase tracking-wider text-[var(--muted)]">Recent</div><div id="history" class="scroll flex-1 overflow-y-auto p-3 space-y-1"></div>
   <div class="border-t border-[var(--line)] p-3 space-y-1">
    <button id="upgrade" class="w-full text-left p-3 rounded-2xl hover:bg-[#f6eee9] flex gap-3"><i data-lucide="crown"></i><span><b>Upgrade to Pro</b><small class="block text-[var(--muted)]">$5 / ₦5,000 monthly</small></span></button>
    <button id="settings" class="w-full text-left p-3 rounded-2xl hover:bg-[#f6eee9] flex gap-3"><i data-lucide="settings"></i> Settings</button>
    <button id="info" class="w-full text-left p-3 rounded-2xl hover:bg-[#f6eee9] flex gap-3"><i data-lucide="circle-help"></i> FAQ & About</button>
    <button id="logout" class="w-full text-left p-3 rounded-2xl hover:bg-[#fff0ec] text-[#9d4c39] flex gap-3"><i data-lucide="log-out"></i> Sign out</button>
   </div>
  </aside><div id="shade" class="hidden fixed inset-0 bg-black/25 z-40 md:hidden"></div>
  <main class="h-full md:pl-[310px] flex flex-col">
   <div id="messages" class="scroll flex-1 overflow-y-auto px-4 py-6 sm:px-6">${msgs.length?msgs.map(messageHTML).join(""):`<div class="h-full flex items-center justify-center"><div class="max-w-xl w-full text-center pop"><div class="mx-auto w-16 h-16 rounded-3xl bg-[#f2e0d8] flex items-center justify-center mb-5"><i data-lucide="sparkles" class="w-8 h-8 text-[var(--accent)]"></i></div><h2 class="text-3xl sm:text-4xl font-bold">Hey! What can I help with? 👋</h2><p class="text-[var(--muted)] mt-3 text-lg">Chat, write, analyze images, study, code, or create something new.</p><div class="grid grid-cols-2 gap-2 mt-7"><button class="suggest p-4 rounded-2xl bg-white border border-[var(--line)] text-left">✍️ Write a blog post</button><button class="suggest p-4 rounded-2xl bg-white border border-[var(--line)] text-left">🖼️ Create an image</button><button class="suggest p-4 rounded-2xl bg-white border border-[var(--line)] text-left">📷 Analyze an image</button><button class="suggest p-4 rounded-2xl bg-white border border-[var(--line)] text-left">💡 Brainstorm an idea</button></div></div></div>`}</div>
   <div class="safe p-3 sm:p-5 bg-[var(--bg)]"><div class="max-w-3xl mx-auto">
    <div id="attachPreview" class="hidden mb-2 bg-white border border-[var(--line)] rounded-2xl p-2 flex items-center gap-3"><img id="attachImg" class="hidden w-12 h-12 rounded-xl object-cover"><i id="attachIcon" data-lucide="file-text" class="text-[var(--accent)]"></i><span id="attachName" class="truncate flex-1"></span><button id="removeAttach" class="p-2"><i data-lucide="x"></i></button></div>
    <div class="bg-white border border-[var(--line)] rounded-[24px] p-2 shadow-sm focus-within:ring-2 focus-within:ring-[#ecd1c7]"><textarea id="input" rows="1" class="w-full px-3 pt-2 resize-none outline-none bg-transparent text-[17px] leading-7 max-h-48" placeholder="Message AURA…"></textarea><div class="flex justify-between items-center pt-2 px-1"><label class="press p-3 rounded-2xl hover:bg-[#f6eee9] cursor-pointer" title="Attach"><i data-lucide="paperclip"></i><input id="file" type="file" class="hidden" accept="image/*,.txt,.md,.json,.js,.jsx,.ts,.tsx,.html,.css,.csv,.pdf,.docx"></label><div class="flex gap-2"><button id="imageBtn" class="press px-3 py-2 rounded-2xl text-sm font-semibold hover:bg-[#f6eee9] flex gap-1 items-center"><i data-lucide="image"></i><span class="hidden sm:inline">Create image</span></button><button id="send" class="press w-11 h-11 rounded-2xl bg-[var(--accent)] text-white flex items-center justify-center"><i data-lucide="arrow-up"></i></button></div></div></div><p class="text-[11px] text-center text-[var(--muted)] mt-2">AURA may make mistakes. Check important information.</p>
   </div></div>
  </main>
 </div></div>`;
 lucide.createIcons(); wireChat(); renderHistory();
 if(keepValue){
  const newInput=document.getElementById("input");
  if(newInput){
   newInput.value=keepValue;
   newInput.style.height="auto";newInput.style.height=Math.min(newInput.scrollHeight,192)+"px";
   if(hadFocus){newInput.focus();if(selStart!=null)newInput.setSelectionRange(selStart,selEnd)}
  }
 }
}
function messageHTML(m,i){
 const user=m.role==="user";const attachment=m.attachment;
 return `<article class="fade max-w-3xl mx-auto mb-7 flex flex-col ${user?"items-end":"items-start"}"><div class="${user?"bg-[#292521] text-white rounded-[22px] rounded-br-md":"w-full"} ${user?"max-w-[88%] sm:max-w-[75%] px-4 py-3":""}">
 ${attachment?.isImage?`<img src="${esc(attachment.data||attachment.url||"")}" class="max-w-full max-h-72 rounded-2xl mb-3 object-contain">`:attachment?.name?`<div class="mb-2 p-3 rounded-2xl bg-[#f5eee9] text-[var(--ink)] flex items-center gap-2"><i data-lucide="file-text"></i>${esc(attachment.name)}</div>`:""}
 ${m.content?user?`<div class="whitespace-pre-wrap text-[16px] leading-7">${esc(m.content)}</div>`:`<div class="prose text-[17px] leading-7">${safeMarkdown(m.content)}</div>`:""}
 </div>
 <div class="flex gap-1 mt-2 ${user?"pr-1":"pl-1"}">
 ${user?`<button class="editMsg p-2 rounded-xl hover:bg-[#f1e9e3] text-[var(--muted)]" data-i="${i}" title="Edit"><i data-lucide="pencil" class="w-4"></i></button><button class="copyMsg p-2 rounded-xl hover:bg-[#f1e9e3] text-[var(--muted)]" data-i="${i}" title="Copy"><i data-lucide="copy" class="w-4"></i></button>`
 :`${attachment?.isImage?`<button class="editImg p-2 rounded-xl hover:bg-[#f1e9e3]" data-i="${i}" title="Edit image"><i data-lucide="wand-sparkles" class="w-4"></i></button>`:""}<button class="copyMsg p-2 rounded-xl hover:bg-[#f1e9e3]" data-i="${i}" title="Copy"><i data-lucide="copy" class="w-4"></i></button><button class="regen p-2 rounded-xl hover:bg-[#f1e9e3]" data-i="${i}" title="Regenerate"><i data-lucide="refresh-cw" class="w-4"></i></button>${m.content&&!attachment?.isImage?`<button class="downloadMsg p-2 rounded-xl hover:bg-[#f1e9e3]" data-i="${i}" title="Download"><i data-lucide="download" class="w-4"></i></button>`:""}`}
 </div></article>`;
}
const codeStore={};let codeStoreN=0;
const renderer=new marked.Renderer();
renderer.code=(code,lang)=>{
 const id="cb"+(++codeStoreN);
 codeStore[id]={code:typeof code==="string"?code:String(code?.text||""),lang:(lang||code?.lang||"").trim()};
 const label=(lang||code?.lang||"code").trim()||"code";
 return `<div class="codeblock rounded-2xl overflow-hidden my-3 border border-[var(--line)]"><div class="codeblock-bar flex items-center justify-between px-3 py-1.5 bg-[#f5eee9] text-xs font-semibold text-[var(--muted)]"><span>${esc(label)}</span><span class="flex gap-1"><button type="button" class="codeCopy press px-2 py-1 rounded-lg hover:bg-[#ecdfd6]" data-id="${id}">Copy</button><button type="button" class="codeDownload press px-2 py-1 rounded-lg hover:bg-[#ecdfd6]" data-id="${id}">Download</button></span></div><pre class="!rounded-none !my-0"><code>${esc(codeStore[id].code)}</code></pre></div>`;
};
marked.setOptions({renderer});
function safeMarkdown(t){return DOMPurify.sanitize(marked.parse(t||""),{ADD_ATTR:["data-id"]})}
function extFor(lang,text){
 const l=(lang||"").toLowerCase();
 const map={html:"html",htm:"html",xml:"xml",svg:"xml",json:"json",js:"js",javascript:"js",jsx:"jsx",ts:"ts",typescript:"ts",tsx:"tsx",py:"py",python:"py",java:"java",c:"c",cpp:"cpp","c++":"cpp",cs:"cs",csharp:"cs",go:"go",golang:"go",rb:"rb",ruby:"rb",php:"php",css:"css",scss:"scss",sql:"sql",sh:"sh",bash:"sh",shell:"sh",yaml:"yaml",yml:"yml",md:"md",markdown:"md",txt:"txt"};
 if(map[l])return map[l];
 const s=(text||"").trim();
 if(/^<!doctype html|^<html[\s>]/i.test(s))return"html";
 if(/^<\?xml/i.test(s)||/^<[a-z0-9:_-]+[\s\S]*<\/[a-z0-9:_-]+>\s*$/i.test(s)&&/^<[a-z]/i.test(s))return"xml";
 return"txt";
}
function mimeFor(ext){return{html:"text/html",xml:"application/xml",json:"application/json",js:"text/javascript",jsx:"text/javascript",ts:"text/typescript",tsx:"text/typescript",py:"text/x-python",css:"text/css",md:"text/markdown"}[ext]||"text/plain"}
function downloadBlob(content,filename,mime){
 const blob=new Blob([content],{type:(mime||"text/plain")+";charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function downloadMessage(i){
 const m=currentChat.messages[i];if(!m?.content)return;
 const ext=extFor("",m.content);
 downloadBlob(m.content,`aura-response-${i}.${ext}`,mimeFor(ext));
}
function renderHistory(){
 const h=document.getElementById("history");if(!h)return;
 h.innerHTML=chats.map(c=>`<button type="button" data-id="${c.id}" class="chatItem w-full text-left p-3 rounded-2xl hover:bg-[#f6eee9] truncate ${currentChat?.id===c.id?"bg-[#f2e0d8]":""}">${esc(c.title||"New conversation")}</button>`).join("");
 // Event delegation on the container (not per-button) so a click always
 // reaches openChat(), even across fast re-renders while a chat is loading.
 h.onclick=e=>{
  const btn=e.target.closest(".chatItem");
  if(!btn)return;
  if(btn.dataset.busy)return;
  btn.dataset.busy="1";btn.classList.add("opacity-60");
  openChat(btn.dataset.id).finally(()=>{btn.dataset.busy="";btn.classList.remove("opacity-60")});
 };
}
let attachment=null;
function wireChat(){
 const drawer=document.getElementById("drawer"),shade=document.getElementById("shade"),open=()=>{drawer.classList.remove("-translate-x-full");shade.classList.remove("hidden")},close=()=>{drawer.classList.add("-translate-x-full");shade.classList.add("hidden")};
 document.getElementById("menuBtn").onclick=open;document.getElementById("closeMenu").onclick=close;shade.onclick=close;
 document.getElementById("newTop").onclick=()=>newChat();document.getElementById("newSide").onclick=()=>newChat();document.getElementById("logout").onclick=()=>signOut(auth);
 document.getElementById("upgrade").onclick=showBilling;document.getElementById("settings").onclick=showSettings;document.getElementById("info").onclick=showInfo;
 document.querySelectorAll(".suggest").forEach(b=>b.onclick=()=>{document.getElementById("input").value=b.textContent.replace(/^.\s/,"");document.getElementById("input").focus()});
 const input=document.getElementById("input");input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,192)+"px"});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});document.getElementById("send").onclick=send;document.getElementById("imageBtn").onclick=generateImage;
 document.getElementById("file").onchange=e=>handleFile(e.target.files[0]);document.getElementById("removeAttach").onclick=()=>{attachment=null;document.getElementById("attachPreview").classList.add("hidden")};
 document.querySelectorAll(".copyMsg").forEach(b=>b.onclick=()=>navigator.clipboard.writeText(currentChat.messages[+b.dataset.i].content).then(()=>notify("Copied ✅")));
 document.querySelectorAll(".regen").forEach(b=>b.onclick=()=>regenerate(+b.dataset.i));document.querySelectorAll(".editImg").forEach(b=>b.onclick=()=>editGeneratedImage(+b.dataset.i));
 document.querySelectorAll(".editMsg").forEach(b=>b.onclick=()=>editUserMessage(+b.dataset.i));
 document.querySelectorAll(".downloadMsg").forEach(b=>b.onclick=()=>downloadMessage(+b.dataset.i));
 const messagesEl=document.getElementById("messages");
 if(messagesEl)messagesEl.addEventListener("click",e=>{
  const copyBtn=e.target.closest(".codeCopy"),dlBtn=e.target.closest(".codeDownload");
  if(copyBtn){const c=codeStore[copyBtn.dataset.id];if(c)navigator.clipboard.writeText(c.code).then(()=>notify("Code copied ✅"));}
  if(dlBtn){const c=codeStore[dlBtn.dataset.id];if(c){const ext=extFor(c.lang,c.code);downloadBlob(c.code,`aura-snippet.${ext}`,mimeFor(ext));}}
 });
 document.getElementById("searchBtn").onclick=searchChats;
}
function editUserMessage(i){
 if(busy)return;
 const m=currentChat.messages[i];if(!m||m.role!=="user")return;
 currentChat.messages=currentChat.messages.slice(0,i);
 render();
 const input=document.getElementById("input");
 input.value=m.content||"";input.focus();
 input.style.height="auto";input.style.height=Math.min(input.scrollHeight,192)+"px";
 input.setSelectionRange(input.value.length,input.value.length);
}
function handleFile(file){
 if(!file)return;
 if(file.size>8*1024*1024)return notify("That file is too large. Please keep uploads under 8 MB.");
 const image=file.type.startsWith("image/"), binary=image||file.type==="application/pdf"||file.name.toLowerCase().endsWith(".docx");
 const r=new FileReader();
 r.onload=()=>{
  attachment={name:file.name,mimeType:file.type,data:binary?r.result:null,isImage:image,content:binary?null:String(r.result).slice(0,30000)};
  document.getElementById("attachPreview").classList.remove("hidden");
  document.getElementById("attachName").textContent=file.name;
  document.getElementById("attachImg").classList.toggle("hidden",!image);
  document.getElementById("attachIcon").classList.toggle("hidden",image);
  if(image)document.getElementById("attachImg").src=r.result;
  lucide.createIcons();
 };
 if(binary)r.readAsDataURL(file);else r.readAsText(file);
}
async function generateImage(){
 if(busy)return;
 const input=document.getElementById("input"),prompt=input.value.trim();
 if(!prompt)return notify("Describe the image you want AURA to create.");
 input.value="";
 busy=true;const btn=document.getElementById("imageBtn");btn.disabled=true;btn.innerHTML='<i data-lucide="loader-2" class="animate-spin"></i> Creating…';lucide.createIcons();
 const userTurn={role:"user",content:prompt};
 currentChat.messages.push(userTurn);
 const ai={role:"assistant",content:"🎨 AURA is creating your image…"};
 currentChat.messages.push(ai);
 render();
 try{
  const d=await api("/image",{prompt,size:"square"});
  ai.content=`![Generated image](${d.url})`;
  ai.attachment={name:"AURA generated image",isImage:true,url:d.url,mimeType:"image/*"};
 }catch(e){ai.content=friendly(e)}
 try{await saveMessage(userTurn);await saveMessage(ai)}catch(e){}
 busy=false;render();
}
async function send(){
 if(busy)return;const input=document.getElementById("input"),text=input.value.trim();if(!text&&!attachment)return;
 const a=attachment;attachment=null;document.getElementById("attachPreview").classList.add("hidden");input.value="";input.style.height="auto";
 const userMsg={role:"user",content:text,attachment:a};currentChat.messages.push(userMsg);
 const isFirstMessage=currentChat.messages.length===1;
 if(isFirstMessage)currentChat.title=(text||a?.name||"New conversation").slice(0,45);
 busy=true;render();const sendBtn=document.getElementById("send");if(sendBtn){sendBtn.disabled=true;sendBtn.innerHTML='<i data-lucide="loader-2" class="animate-spin"></i>';lucide.createIcons()}
 try{
  await saveMessage(userMsg);
  if(isFirstMessage)await setDoc(doc(db,"users",user.uid,"chats",currentChat.id),{title:currentChat.title,updatedAt:serverTimestamp()},{merge:true});
 }catch(e){notify("Your message is shown here, but AURA couldn't save it to your account right now. Check your connection.")}
 const ai={role:"assistant",content:"🤔 AURA is thinking…"};currentChat.messages.push(ai);render();
 try{
  const d=await api("/chat",{messages:currentChat.messages.slice(0,-1).map(x=>({role:x.role,content:x.content})),prompt:text,attachment:a});
  ai.content=d.text||"I couldn't produce a response this time.";
 }catch(e){ai.content=friendly(e)}
 try{await saveMessage(ai)}catch(e){}
 busy=false;render()
}
async function regenerate(i){if(busy)return;const m=currentChat.messages[i-1];if(!m||m.role!=="user")return;currentChat.messages=currentChat.messages.slice(0,i);render();const fakeInput=document.getElementById("input");fakeInput.value=m.content;await send()}
async function editGeneratedImage(i){
 const m=currentChat.messages[i], src=m?.attachment?.url||m?.attachment?.data;if(!src)return;
 const box=overlay("Edit image",`<img src="${esc(src)}" class="w-full max-h-72 object-contain rounded-2xl bg-[#f3eee9]"><textarea id="editPrompt" class="mt-4 w-full rounded-2xl border border-[var(--line)] p-3 min-h-24 outline-none" placeholder="Tell AURA what to change…"></textarea><button id="doEdit" class="mt-3 w-full h-12 rounded-2xl bg-[var(--accent)] text-white font-bold">Generate edit</button>`);
 box.querySelector("#doEdit").onclick=async()=>{
  const prompt=box.querySelector("#editPrompt").value.trim();if(!prompt)return notify("Describe the change first.");
  const b=box.querySelector("#doEdit");b.disabled=true;b.textContent="Editing…";
  try{const d=await api("/image",{prompt,imageUrl:src});m.attachment.url=d.url;m.content=`![Edited image](${d.url})`;await saveMessage(m);box.remove();render();}catch(e){notify(friendly(e))}finally{b.disabled=false;b.textContent="Generate edit"}
 };
}
function searchChats(){
 const box=overlay("Search chats",`<input id="chatSearchInput" type="text" inputmode="search" autocomplete="off" placeholder="Search your recent chats…" class="w-full h-12 rounded-2xl border border-[var(--line)] bg-white px-4 outline-none focus:ring-2 focus:ring-[#e7b5a4]"><div id="chatSearchResults" class="mt-4 space-y-1 max-h-[50vh] overflow-y-auto"></div>`);
 const input=box.querySelector("#chatSearchInput"),results=box.querySelector("#chatSearchResults");
 const paint=term=>{
  const t=term.trim().toLowerCase();
  const hits=t?chats.filter(c=>(c.title||"").toLowerCase().includes(t)):chats;
  results.innerHTML=hits.length
   ?hits.map(c=>`<button data-id="${c.id}" class="chatHit w-full text-left p-3 rounded-2xl hover:bg-[#f6eee9] truncate">${esc(c.title||"New conversation")}</button>`).join("")
   :`<p class="text-sm text-[var(--muted)] p-3">${t?"No matching recent chats.":"Start typing to search your recent chats."}</p>`;
  results.querySelectorAll(".chatHit").forEach(b=>b.onclick=()=>{openChat(b.dataset.id);box.remove()});
 };
 paint("");
 input.addEventListener("input",()=>paint(input.value));
 input.focus();
}
function overlay(title,body){const x=document.createElement("div");x.className="fixed inset-0 z-[80] bg-black/30 flex items-end sm:items-center justify-center p-0 sm:p-5";x.innerHTML=`<div class="sheet bg-[var(--panel)] w-full sm:max-w-lg max-h-[88vh] overflow-y-auto rounded-t-[28px] sm:rounded-[28px] p-6 fade"><div class="flex justify-between items-center mb-5"><h2 class="text-2xl font-bold">${title}</h2><button class="close p-2"><i data-lucide="x"></i></button></div>${body}</div></div>`;document.body.appendChild(x);lucide.createIcons();x.querySelector(".close").onclick=()=>x.remove();return x}
function showSettings(){const box=overlay("Settings",`<div class="space-y-3"><div class="p-4 rounded-2xl bg-[#f7f0eb]"><b>Account</b><p class="text-sm text-[var(--muted)] mt-1">${esc(user.email)}</p><p class="text-sm mt-1">Plan: <b>${plan.toUpperCase()}</b></p></div><button class="w-full p-4 rounded-2xl border border-[var(--line)] text-left" id="notifyBtn">🔔 Enable notifications</button><button class="w-full p-4 rounded-2xl border border-[var(--line)] text-left" id="testNotifyBtn">🧪 Send test notification</button><button class="w-full p-4 rounded-2xl border border-[var(--line)] text-left" id="deleteChats">🗑️ Delete local chat cache</button><p class="text-xs text-[var(--muted)]">Notifications use Firebase Cloud Messaging. The test button verifies that this signed-in account and device can receive FCM messages.</p><p class="text-xs text-[var(--muted)]">AURA stores conversations in your Firebase account and only loads a limited recent set to control database usage.</p></div>`);box.querySelector("#notifyBtn").onclick=enableNotifications;box.querySelector("#testNotifyBtn").onclick=sendTestNotification}
function showInfo(){overlay("FAQ & About",`<div class="space-y-3 text-[16px] leading-7"><details open><summary class="font-bold cursor-pointer">What is AURA?</summary><p class="text-[var(--muted)]">AURA is a general AI assistant for conversation, writing, blogging, files, images, study and coding.</p></details><details><summary class="font-bold cursor-pointer">What can I upload?</summary><p class="text-[var(--muted)]">Images and common text/code files can be analyzed. Large files may be limited by the selected AI model.</p></details><details><summary class="font-bold cursor-pointer">What is Pro?</summary><p class="text-[var(--muted)]">Pro is $5 / ₦5,000 monthly and includes up to 10 image generations per day, subject to configured model availability.</p></details><details><summary class="font-bold cursor-pointer">Privacy</summary><p class="text-[var(--muted)]">Your account and saved chats are stored in Firebase. AI requests may be processed by the configured AI providers. Contact wytetechcompany@gmail.com for privacy/data requests.</p></details><div class="pt-3 border-t border-[var(--line)]"><b>AURA AI</b><p class="text-sm text-[var(--muted)]">By Wyte Tech Company · wytetechcompany@gmail.com</p></div></div>`)}
function showBilling(){overlay("AURA Pro",`<div class="rounded-3xl bg-[#f2e0d8] p-5"><div class="text-sm text-[var(--accent2)] font-bold">PRO</div><div class="text-3xl font-black mt-1">$5 / ₦5,000</div><div class="text-[var(--muted)]">per month</div><ul class="mt-4 space-y-2 text-sm"><li>✓ Up to 10 image generations/day</li><li>✓ Better model routing when needed</li><li>✓ Higher capability limits</li><li>✓ Priority image features</li></ul><button id="payBtn" class="press mt-5 w-full h-12 rounded-2xl bg-[var(--accent)] text-white font-bold">Upgrade securely</button><p id="payNote" class="text-xs text-[var(--muted)] mt-3">Secure Flutterwave checkout • ₦5,000/month in Nigeria • $5/month internationally.</p></div>`).querySelector("#payBtn").onclick=startPayment}
async function startPayment(){
 if(typeof window.FlutterwaveCheckout!=="function")return notify("Secure checkout is still loading. Please try again in a moment.");
 const publicKey=window.AURA_FLUTTERWAVE_PUBLIC_KEY;
 if(!publicKey)return notify("The Pro checkout is temporarily unavailable. Please try again shortly.");
 const isNigeria=(Intl.DateTimeFormat().resolvedOptions().locale||"").toUpperCase().includes("NG");
 const currency=isNigeria?"NGN":"USD";
 const amount=currency==="NGN"?5000:5;
 const payBtn=document.getElementById("payBtn"),payNote=document.getElementById("payNote");
 const resetBtn=()=>{if(payBtn){payBtn.disabled=false;payBtn.textContent="Upgrade securely"}};
 if(payBtn){payBtn.disabled=true;payBtn.textContent="Opening secure checkout…"}
 window.FlutterwaveCheckout({
  public_key:publicKey,
  tx_ref:`aura_${user.uid}_${Date.now()}`,
  amount, currency,
  payment_options:"card,mobilemoney,ussd,banktransfer",
  customer:{email:user.email,name:user.displayName||user.email},
  meta:{app:"aura",aura_user_id:user.uid,plan:"pro"},
  customizations:{title:"AURA Pro",description:"AURA Pro monthly subscription",logo:location.origin+"/icon-512.png"},
  callback:async response=>{
   resetBtn();
   if(response?.status!=="successful"&&response?.status!=="completed"){notify("Payment wasn't completed. No charge was made.");return;}
   if(payNote)payNote.textContent="Verifying your payment…";
   try{
    await api("/verify-payment",{transaction_id:response.transaction_id});
    await loadPlan();
    notify("AURA Pro is now active — welcome aboard! 🎉");
    document.querySelector(".fixed.inset-0.z-\\[80\\]")?.remove();
    render();
   }catch(e){notify(friendly(e))}
  },
  onclose:resetBtn
 });
}
let fcmReady=false; let fcmUnsubscribe=null;
async function registerNotifications({askPermission=false,silent=false}={}){
 try{
  if(!user)return false;
  if(!(await messagingSupported())){if(!silent)notify("Notifications aren't supported by this browser or device.");return false;}
  if(!('Notification' in window)){if(!silent)notify("This browser does not provide notification permissions.");return false;}
  let permission=Notification.permission;
  if(permission!=="granted" && askPermission) permission=await Notification.requestPermission();
  if(permission!=="granted"){if(!silent)notify("Notifications are still off. Allow them in your browser settings, then try again.");return false;}
  const vapid=globalThis.AURA_FIREBASE_VAPID_KEY;
  if(!vapid){if(!silent)notify("AURA is missing its Firebase notification key.");return false;}
  const registration=swRegistration || await navigator.serviceWorker.ready;
  const m=getMessaging(app);
  const t=await getToken(m,{vapidKey:vapid,serviceWorkerRegistration:registration});
  if(!t)throw Error("NO_TOKEN");
  await api("/notifications",{action:"register",token:t,platform:"web",userAgent:navigator.userAgent});
  if(fcmUnsubscribe)fcmUnsubscribe();
  fcmUnsubscribe=onMessage(m,p=>{const n=p.notification||p.data||{};notify(n.body||"AURA has an update.");});
  fcmReady=true;
  if(!silent)notify("Notifications enabled. We'll keep this device registered.");
  return true;
 }catch(e){console.error("FCM registration failed",e);if(!silent)notify("AURA couldn't finish notification setup. Please try again from Settings.");return false;}
}
async function enableNotifications(){return registerNotifications({askPermission:true});}
async function sendTestNotification(){try{const d=await api("/notifications",{action:"sendTest"});notify(d.sent?"Test notification sent. Check your notification shade.":"The test could not be delivered yet.");}catch(e){notify(friendly(e));}}

let swRegistration=null;
if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js",{scope:"/"}).then(r=>{swRegistration=r}).catch(e=>console.warn("Service worker registration failed",e));}
getRedirectResult(auth).catch(e=>{if(e?.code!=="auth/no-current-user")console.error("Redirect sign-in failed:",e?.code,e?.message)});
onAuthStateChanged(auth,async u=>{user=u;if(!u){renderAuth();return}try{await saveUser();await loadPlan();await loadChats();setTimeout(()=>registerNotifications({askPermission:false,silent:true}),700)}catch(e){console.error(e);notify("Your account is signed in, but AURA couldn't load your chats. Please refresh.");await newChat(false)}});
